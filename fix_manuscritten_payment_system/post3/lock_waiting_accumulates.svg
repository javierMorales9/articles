<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Waiting accumulates across requests</title>
  <desc id="desc">A Gantt-style chart showing four requests arriving every 100ms. Each locked section takes 300ms, so later requests wait longer before acquiring the lock.</desc>

  <style>
    text {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      fill: #111827;
    }

    .axis-label,
    .tick-label {
      font-size: 16px;
      font-weight: 700;
    }

    .row-label {
      font-size: 22px;
      font-weight: 800;
    }

    .bar-label {
      fill: #ffffff;
      font-size: 18px;
      font-weight: 800;
    }

    .arrival-label {
      font-size: 14px;
      font-weight: 700;
    }

    .legend-label {
      font-size: 18px;
      font-weight: 650;
    }

    .grid {
      stroke: #9ca3af;
      stroke-width: 1.5;
      stroke-dasharray: 5 7;
    }

    .axis {
      stroke: #111827;
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    .tick {
      stroke: #111827;
      stroke-width: 2;
    }

    .arrival {
      stroke: #111827;
      stroke-width: 4;
      stroke-linecap: round;
    }

    .wait {
      fill: #0969f6;
    }

    .lock {
      fill: #ef111a;
    }
  </style>

  <rect width="1200" height="590" fill="#ffffff" />

  <g transform="translate(0 -45)">
  <text class="axis-label" x="38" y="126">Time (ms)</text>

  <line class="axis" x1="165" y1="145" x2="1084" y2="145" />
  <path d="M1084 145 L1073 137 M1084 145 L1073 153" fill="none" class="axis" />

  <g>
    <line class="grid" x1="165" y1="145" x2="165" y2="505" />
    <line class="tick" x1="165" y1="136" x2="165" y2="154" />
    <text class="tick-label" x="165" y="124" text-anchor="middle">0ms</text>

    <line class="grid" x1="240" y1="145" x2="240" y2="505" />
    <line class="tick" x1="240" y1="136" x2="240" y2="154" />
    <text class="tick-label" x="240" y="124" text-anchor="middle">100ms</text>

    <line class="grid" x1="315" y1="145" x2="315" y2="505" />
    <line class="tick" x1="315" y1="136" x2="315" y2="154" />
    <text class="tick-label" x="315" y="124" text-anchor="middle">200ms</text>

    <line class="grid" x1="390" y1="145" x2="390" y2="505" />
    <line class="tick" x1="390" y1="136" x2="390" y2="154" />
    <text class="tick-label" x="390" y="124" text-anchor="middle">300ms</text>

    <line class="grid" x1="465" y1="145" x2="465" y2="505" />
    <line class="tick" x1="465" y1="136" x2="465" y2="154" />
    <text class="tick-label" x="465" y="124" text-anchor="middle">400ms</text>

    <line class="grid" x1="540" y1="145" x2="540" y2="505" />
    <line class="tick" x1="540" y1="136" x2="540" y2="154" />
    <text class="tick-label" x="540" y="124" text-anchor="middle">500ms</text>

    <line class="grid" x1="615" y1="145" x2="615" y2="505" />
    <line class="tick" x1="615" y1="136" x2="615" y2="154" />
    <text class="tick-label" x="615" y="124" text-anchor="middle">600ms</text>

    <line class="grid" x1="690" y1="145" x2="690" y2="505" />
    <line class="tick" x1="690" y1="136" x2="690" y2="154" />
    <text class="tick-label" x="690" y="124" text-anchor="middle">700ms</text>

    <line class="grid" x1="765" y1="145" x2="765" y2="505" />
    <line class="tick" x1="765" y1="136" x2="765" y2="154" />
    <text class="tick-label" x="765" y="124" text-anchor="middle">800ms</text>

    <line class="grid" x1="840" y1="145" x2="840" y2="505" />
    <line class="tick" x1="840" y1="136" x2="840" y2="154" />
    <text class="tick-label" x="840" y="124" text-anchor="middle">900ms</text>

    <line class="grid" x1="915" y1="145" x2="915" y2="505" />
    <line class="tick" x1="915" y1="136" x2="915" y2="154" />
    <text class="tick-label" x="915" y="124" text-anchor="middle">1000ms</text>

    <line class="grid" x1="990" y1="145" x2="990" y2="505" />
    <line class="tick" x1="990" y1="136" x2="990" y2="154" />
    <text class="tick-label" x="990" y="124" text-anchor="middle">1100ms</text>

    <line class="grid" x1="1065" y1="145" x2="1065" y2="505" />
    <line class="tick" x1="1065" y1="136" x2="1065" y2="154" />
    <text class="tick-label" x="1065" y="124" text-anchor="middle">1200ms</text>
  </g>

  <text class="row-label" x="35" y="210">Request 1</text>
  <text class="row-label" x="35" y="305">Request 2</text>
  <text class="row-label" x="35" y="400">Request 3</text>
  <text class="row-label" x="35" y="495">Request 4</text>

  <rect class="lock" x="165" y="180" width="225" height="42" rx="2" />
  <line class="arrival" x1="165" y1="178" x2="165" y2="224" />
  <text class="bar-label" x="277.5" y="207" text-anchor="middle">holds lock 300ms</text>
  <text class="arrival-label" x="165" y="244" text-anchor="middle">arrives</text>
  <text class="arrival-label" x="165" y="262" text-anchor="middle">at 0ms</text>

  <rect class="wait" x="240" y="275" width="150" height="42" rx="2" />
  <rect class="lock" x="390" y="275" width="225" height="42" rx="2" />
  <line class="arrival" x1="240" y1="273" x2="240" y2="319" />
  <text class="bar-label" x="315" y="302" text-anchor="middle">waits 200ms</text>
  <text class="bar-label" x="502.5" y="302" text-anchor="middle">holds lock 300ms</text>
  <text class="arrival-label" x="240" y="339" text-anchor="middle">arrives</text>
  <text class="arrival-label" x="240" y="357" text-anchor="middle">at 100ms</text>

  <rect class="wait" x="315" y="370" width="300" height="42" rx="2" />
  <rect class="lock" x="615" y="370" width="225" height="42" rx="2" />
  <line class="arrival" x1="315" y1="368" x2="315" y2="414" />
  <text class="bar-label" x="465" y="397" text-anchor="middle">waits 400ms</text>
  <text class="bar-label" x="727.5" y="397" text-anchor="middle">holds lock 300ms</text>
  <text class="arrival-label" x="315" y="434" text-anchor="middle">arrives</text>
  <text class="arrival-label" x="315" y="452" text-anchor="middle">at 200ms</text>

  <rect class="wait" x="390" y="465" width="450" height="42" rx="2" />
  <rect class="lock" x="840" y="465" width="225" height="42" rx="2" />
  <line class="arrival" x1="390" y1="463" x2="390" y2="509" />
  <text class="bar-label" x="615" y="492" text-anchor="middle">waits 600ms</text>
  <text class="bar-label" x="952.5" y="492" text-anchor="middle">holds lock 300ms</text>
  <text class="arrival-label" x="390" y="529" text-anchor="middle">arrives</text>
  <text class="arrival-label" x="390" y="547" text-anchor="middle">at 300ms</text>

  <g transform="translate(445 590)">
    <rect class="wait" x="0" y="-22" width="70" height="30" rx="2" />
    <text class="legend-label" x="88" y="1">waiting</text>
    <rect class="lock" x="240" y="-22" width="70" height="30" rx="2" />
    <text class="legend-label" x="328" y="1">holds lock</text>
  </g>
  </g>
</svg>
